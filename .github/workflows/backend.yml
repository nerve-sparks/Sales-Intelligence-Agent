# Backend CD
#   On push to main (backend / compose changes): SSH to the server, pull the
#   latest code, rebuild and restart the stack with docker compose. Postgres,
#   migrations (the `migrate` service), the API and pgAdmin all come from
#   docker-compose.yml on the server.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (repo is checked out at /root/Sales-Intelligence-Agent)
#   SSH_PORT is optional (defaults to 22).
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Shared with frontend.yml so two deploys never `git pull` on the server at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /root/Sales-Intelligence-Agent
            git pull origin main
            docker compose build
            docker compose up -d
            docker image prune -f
            docker compose ps
